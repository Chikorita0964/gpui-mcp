[package]
name = "gpui-mcp-html"
description = "Pure HTML authoring, live rendering, bindings, and scaffolding for GPUI MCP applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# No doc tests in this crate: cargo test --doc would build its docs for nothing.
doctest = false

[features]
default = ["runtime", "json", "ron"]
# The live renderer, on GPUI Fast. CSS transitions and @keyframes run on GPUI
# Kit's motion runtime (`gpui_base::motion`), which generated GPUI Kit code uses
# too.
runtime = ["dep:gpui", "dep:gpui-base", "dep:gpui-mcp", "dep:gpui-view-transitions", "dep:htmlswap"]
# GPUI test contexts for this crate's tests and for apps testing rendered HTML.
test-support = ["gpui?/test-support", "gpui-mcp/test-support"]
dev-watch = ["runtime", "dep:notify", "ron"]
json = ["dep:serde_json"]
ron = ["dep:ron"]
visual-parity = ["runtime", "dep:anyhow", "dep:clap", "dep:gpui-mcp-capture", "dep:gpui_platform", "dep:image", "gpui-mcp/test-support"]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
cow-utils.workspace = true
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
gpui-mcp = { path = "../gpui-mcp", optional = true }
gpui-mcp-capture = { path = "../gpui-mcp-capture", optional = true }
gpui-base = { workspace = true, optional = true }
gpui-view-transitions = { path = "../gpui-view-transitions", optional = true }
htmlswap = { workspace = true, optional = true }
image = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
rustc-hash.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[[bin]]
name = "gpui-mcp-html-visual"
path = "src/bin/visual.rs"
required-features = ["visual-parity"]

[dev-dependencies]
gpui-mcp = { path = "../gpui-mcp", features = ["test-support"] }
tempfile = "3.23.0"

[lints]
workspace = true
