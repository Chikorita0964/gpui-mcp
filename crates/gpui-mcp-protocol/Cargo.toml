[package]
name = "gpui-mcp-protocol"
description = "Authenticated local wire protocol shared by gpui-mcp components"
version.workspace = true
edition.workspace = true
# Apps link this crate, so it builds on an older Rust than the rest of the
# workspace. The `msrv` CI job keeps it that way.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# No doc tests in this crate: cargo test --doc would build its docs for nothing.
doctest = false

[dependencies]
directories.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
