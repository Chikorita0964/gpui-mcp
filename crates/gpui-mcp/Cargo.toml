[package]
name = "gpui-mcp"
description = "A hardened, cross-platform MCP automation bridge for GPUI applications"
version.workspace = true
edition.workspace = true
# Apps link this crate, so it builds on an older Rust than the rest of the
# workspace. The `msrv` CI job keeps it that way.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["zed"]
zed = ["dep:gpui"]
gpui-pre = ["dep:gpui_pre"]
test-support = ["gpui?/test-support", "gpui_pre?/test-support"]

[dependencies]
async-channel.workspace = true
gpui = { workspace = true, optional = true }
gpui_pre = { workspace = true, optional = true }
gpui-mcp-protocol = { path = "../gpui-mcp-protocol" }
interprocess.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio.workspace = true

[lints]
workspace = true
