[package]
name = "gpui-mcp"
description = "A hardened, cross-platform MCP automation bridge for GPUI applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# No doc tests in this crate: cargo test --doc would build its docs for nothing.
doctest = false

[features]
# The public test-support API doesn't need GPUI's own test support; only this
# crate's unit tests do.
test-support = ["gpui/test-support"]

[dependencies]
async-channel.workspace = true
cow-utils.workspace = true
gpui.workspace = true
gpui-mcp-protocol = { path = "../gpui-mcp-protocol" }
interprocess.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
