[workspace]
members = [
    "crates/gpui-mcp-capture",
    "crates/gpui-mcp-protocol",
    "crates/gpui-mcp",
    "crates/gpui-mcp-html",
    "crates/gpui-mcp-server",
    "crates/gpui-view-transitions",
    "examples/demo",
    "examples/runtime-showcase",
    "xtask",
]
exclude = ["vendor/gpui", "vendor/gpui-pre", "vendor/gpui-ce", "examples/gpui-kit"]
default-members = ["crates/gpui-mcp-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/themixednuts/gpui-mcp"
homepage = "https://github.com/themixednuts/gpui-mcp"

[workspace.dependencies]
anyhow = "1.0.100"
async-channel = "2.5.0"
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
cow-utils = "0.1.3"
directories = "6.0.0"
# Declared from the Zed git source rather than by path so a consuming workspace
# can redirect it with `[patch."https://github.com/zed-industries/zed"]` to the
# GPUI tree its own application links (a path dependency is not patchable). The
# rev names the commit `vendor/gpui` was cut from; this workspace's own patch
# below resolves it to that vendored tree, so the rev is never fetched here.
gpui = { git = "https://github.com/zed-industries/zed", rev = "16c9aa7ea6d897a8044d9501cde1b295256722f2", version = "=0.2.2" }
# Every version these accept has a patch series in vendor/patches/<crate>/.
# `cargo xtask vendor` fails if a requirement and vendor/<crate>.json differ.
gpui_pre = { package = "gpui-pre", version = ">=0.3.5, <=0.3.7" }
gpui_ce = { package = "gpui-ce", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "16c9aa7ea6d897a8044d9501cde1b295256722f2", features = ["font-kit", "wayland", "x11"] }
# GPUI Kit's foundation crate, for its motion runtime. It pins gpui-pre 0.3.7.
# GPUI Kit's base layer, for its motion runtime. 0.6.4 accepts gpui-pre ^0.3.5
# and 0.7.0 pins 0.3.7, so this range has a release for every gpui-pre the
# bridge accepts; the motion API is the same across it.
gpui-base = { version = ">=0.6.4, <0.8", default-features = false }
htmlswap = { git = "https://github.com/themixednuts/htmlswap", rev = "80d36dff051050165ad8fdabc89abd288c9a72fc" }
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
insta = "1.49.0"
interprocess = { version = "2.4.2", features = ["tokio"] }
notify = "8.2.0"
mp4 = "0.14.0"
openh264 = "0.9.7"
rand = "0.9.2"
raw-window-handle = "0.6.2"
ron = "0.12.2"
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
rustc-hash = "2.1.3"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3.23.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
xcap = { version = "0.9.8", features = ["wgc"] }
widestring = "1.2.1"

# oxc's lint tables (oxc-project/oxc Cargo.toml), on top of this workspace's
# own stricter rules.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
self_named_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"
exit = "warn"
format_push_string = "warn"
fn_to_numeric_cast_any = "warn"
unnecessary_self_imports = "warn"
try_err = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"
infinite_loop = "warn"
map_with_unused_argument_over_ranges = "warn"
unused_result_ok = "warn"
pathbuf_init_then_push = "warn"
pub_underscore_fields = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
# pedantic lints oxc allows
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
similar_names = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev.package.image]
opt-level = 2

# Snapshot comparison and its diff, optimized as insta recommends (and oxc does).
[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[patch.crates-io]
gpui = { path = "vendor/gpui" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-ce = { path = "vendor/gpui-ce" }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui" }
