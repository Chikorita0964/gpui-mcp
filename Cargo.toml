[workspace]
members = [
    "crates/gpui-mcp-capture",
    "crates/gpui-mcp-protocol",
    "crates/gpui-mcp",
    "crates/gpui-mcp-html",
    "crates/gpui-mcp-server",
    "crates/gpui-view-transitions",
    "examples/gpui-kit",
    "examples/runtime-showcase",
    "xtask",
]
exclude = ["vendor/gpui-fast"]
default-members = ["crates/gpui-mcp-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/themixednuts/gpui-mcp"
homepage = "https://github.com/themixednuts/gpui-mcp"
readme = "README.md"
keywords = ["gpui", "mcp", "automation", "accessibility", "testing"]
categories = ["gui", "development-tools::testing", "accessibility"]

[workspace.dependencies]
anyhow = "1.0.100"
async-channel = "2.5.0"
base64 = "0.23.1"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
cow-utils = "0.1.3"
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# GPUI Fast (longbridge/gpui-fast), the one GPUI this workspace builds on, under
# GPUI's own crate names. The version has a patch series in
# vendor/patches/gpui-fast/; `cargo xtask vendor` fails if it and
# vendor/gpui-fast.json differ.
gpui = { package = "gpui-fast", version = "=0.1.6" }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.6", features = ["font-kit", "wayland", "x11"] }
# GPUI Kit's base layer, for its motion runtime, from GPUI Kit's GitHub main
# (its gpui-fast support is not in a release yet), on GPUI Fast.
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "ed27c6293b585acc40c10be7138534243bee5841", default-features = false, features = [
    "gpui-fast",
] }
# GPUI Kit itself, for the example the server's end-to-end tests drive.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "ed27c6293b585acc40c10be7138534243bee5841", features = ["gpui-fast"] }
htmlswap = { git = "https://github.com/themixednuts/htmlswap", rev = "80d36dff051050165ad8fdabc89abd288c9a72fc" }
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
insta = "1.49.0"
interprocess = { version = "2.4.2", features = ["tokio"] }
notify = "8.2.0"
mp4 = "0.14.0"
openh264 = "0.9.7"
rand = "0.10.3"
raw-window-handle = "0.6.2"
ron = "0.12.2"
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
rustc-hash = "2.1.3"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3.23.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
xcap = { version = "0.9.8", features = ["wgc"] }
widestring = "1.2.1"

# oxc's lint tables (oxc-project/oxc Cargo.toml), on top of this workspace's
# own stricter rules.
[workspace.lints.rust]
# `cranelift`: set by test builds on the Cranelift backend, which catches no unwind.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(cranelift)"] }
unsafe_code = "deny"
missing_docs = "warn"
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
self_named_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"
exit = "warn"
format_push_string = "warn"
fn_to_numeric_cast_any = "warn"
unnecessary_self_imports = "warn"
try_err = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"
infinite_loop = "warn"
map_with_unused_argument_over_ranges = "warn"
unused_result_ok = "warn"
pathbuf_init_then_push = "warn"
pub_underscore_fields = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
# pedantic lints oxc allows
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
similar_names = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"
# nursery, with the lints oxc allows
nursery = { level = "warn", priority = -1 }
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
cognitive_complexity = "allow"
non_send_fields_in_send_ty = "allow"
use_self = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
fallible_impl_from = "allow"
useless_let_if_seq = "allow"
impl_trait_in_params = "allow"
# GPUI's futures run on its foreground executor and are never sent.
future_not_send = "allow"
# cargo
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
# `test-support` is GPUI's own name for it, which apps already enable.
redundant_feature_names = "allow"

[profile.dev]
# No debug info, as oxc builds: a failing assertion still names its file and line. Sixteen codegen
# units, as Zed has them.
debug = false
codegen-units = 16

# What is built for build time the same, so a crate both sides use is built once (Zed).
[profile.dev.build-override]
debug = false
codegen-units = 16

[profile.dev.package]
# Every proc macro and what it uses: they run inside the compiler on every build.
arg_enum_proc_macro = { opt-level = 3 }
async-recursion = { opt-level = 3 }
async-trait = { opt-level = 3 }
borsh-derive = { opt-level = 3 }
bytemuck_derive = { opt-level = 3 }
clap_derive = { opt-level = 3 }
const-random-macro = { opt-level = 3 }
convert_case = { opt-level = 3 }
cssparser-macros = { opt-level = 3 }
darling = { opt-level = 3 }
darling_core = { opt-level = 3 }
darling_macro = { opt-level = 3 }
derive_more-impl = { opt-level = 3 }
displaydoc = { opt-level = 3 }
doctest-file = { opt-level = 3 }
document-features = { opt-level = 3 }
enum-iterator-derive = { opt-level = 3 }
enumflags2_derive = { opt-level = 3 }
enumn = { opt-level = 3 }
equator-macro = { opt-level = 3 }
foreign-types-macros = { opt-level = 3 }
futures-macro = { opt-level = 3 }
getrandom = { opt-level = 3 }
glob = { opt-level = 3 }
gpui-component-macros = { opt-level = 3 }
gpui-fast-macros = { opt-level = 3 }
gpui-pre-derive-refineable = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-perf = { opt-level = 3 }
gpui-pre-util-macros = { opt-level = 3 }
gpui-pre-ztracing-macro = { opt-level = 3 }
heck = { opt-level = 3 }
include_dir_macros = { opt-level = 3 }
interpolate_name = { opt-level = 3 }
jni-macros = { opt-level = 3 }
jni-sys-macros = { opt-level = 3 }
lightningcss-derive = { opt-level = 3 }
linktime-proc-macro = { opt-level = 3 }
litrs = { opt-level = 3 }
mime_guess = { opt-level = 3 }
multiversion_no_op = { opt-level = 3 }
noop_proc_macro = { opt-level = 3 }
num-derive = { opt-level = 3 }
once_cell = { opt-level = 3 }
oxc-miette-derive = { opt-level = 3 }
oxc_ast_macros = { opt-level = 3 }
paste = { opt-level = 3 }
pastey = { opt-level = 3 }
phf = { opt-level = 3 }
phf_generator = { opt-level = 3 }
phf_macros = { opt-level = 3 }
phf_shared = { opt-level = 3 }
pin-project-internal = { opt-level = 3 }
proc-macro-crate = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
profiling-procmacros = { opt-level = 3 }
proptest-macro = { opt-level = 3 }
quick-xml = { opt-level = 3 }
quote = { opt-level = 3 }
ref-cast-impl = { opt-level = 3 }
rmcp-macros = { opt-level = 3 }
rust-embed-impl = { opt-level = 3 }
rust-embed-utils = { opt-level = 3 }
rust-i18n-macro = { opt-level = 3 }
rust-i18n-support = { opt-level = 3 }
rustc_version = { opt-level = 3 }
rustversion = { opt-level = 3 }
schemars_derive = { opt-level = 3 }
seq-macro = { opt-level = 3 }
serde = { opt-level = 3 }
serde_derive = { opt-level = 3 }
serde_derive_internals = { opt-level = 3 }
serde_repr = { opt-level = 3 }
shellexpand = { opt-level = 3 }
simd_cesu8 = { opt-level = 3 }
simd_helpers = { opt-level = 3 }
static-self-derive = { opt-level = 3 }
strum_macros = { opt-level = 3 }
syn = { opt-level = 3 }
synstructure = { opt-level = 3 }
thiserror-impl = { opt-level = 3 }
tiny-keccak = { opt-level = 3 }
tokio-macros = { opt-level = 3 }
tracing-attributes = { opt-level = 3 }
unicode-xid = { opt-level = 3 }
walkdir = { opt-level = 3 }
wasm-bindgen-macro = { opt-level = 3 }
wasm-bindgen-macro-support = { opt-level = 3 }
wayland-scanner = { opt-level = 3 }
windows-implement = { opt-level = 3 }
windows-interface = { opt-level = 3 }
yoke-derive = { opt-level = 3 }
zbus-lockstep = { opt-level = 3 }
zbus-lockstep-macros = { opt-level = 3 }
zbus_macros = { opt-level = 3 }
zbus_names = { opt-level = 3 }
zbus_xml = { opt-level = 3 }
zerocopy-derive = { opt-level = 3 }
zerofrom-derive = { opt-level = 3 }
zeroize_derive = { opt-level = 3 }
zerovec-derive = { opt-level = 3 }
zvariant = { opt-level = 3 }
zvariant_derive = { opt-level = 3 }
zvariant_utils = { opt-level = 3 }
# Hot at run time in tests (as Zed has them).
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
serde_json = { opt-level = 3 }
image = { opt-level = 2 }
# Snapshot comparison and its diff, optimized as insta recommends (and oxc does).
insta = { opt-level = 3 }
similar = { opt-level = 3 }
# Single-file packages in one codegen unit (Zed).
gpui-mcp-capture = { codegen-units = 1 }
runtime-showcase = { codegen-units = 1 }

[profile.release]
# The best code, as oxc and Zed build their releases.
lto = "fat"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
gpui-fast = { path = "vendor/gpui-fast" }
