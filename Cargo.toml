[workspace]
members = [
    "crates/gpui-mcp-capture",
    "crates/gpui-mcp-protocol",
    "crates/gpui-mcp",
    "crates/gpui-mcp-html",
    "crates/gpui-mcp-server",
    "examples/demo",
    "examples/runtime-showcase",
    "xtask",
]
# This fork ships no vendor/gpui-ce tree (amendment 1 keeps only its patch files under
# vendor/patches/gpui-ce/); the exclusion is upstream's and keeps the next sync smaller.
exclude = ["vendor/gpui-pre", "vendor/gpui-ce", "examples/gpui-kit"]
default-members = ["crates/gpui-mcp-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/themixednuts/gpui-mcp"
homepage = "https://github.com/themixednuts/gpui-mcp"

[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
bytes = "1.11.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
# The crates.io `gpui-pre` snapshot repository: Zed's GPUI published under another
# name (its library is still `gpui`), the GPUI that GPUI Kit 0.7.0 pins. Declared
# from crates.io rather than by path so a consuming workspace can redirect it with
# `[patch.crates-io] gpui-pre = { ... }` to the tree its own application links (a
# path dependency is not patchable). This workspace's own patch below resolves it
# to the vendored tree. The requirement spans exactly the releases that have a
# patch series in vendor/patches/gpui-pre/; `cargo xtask vendor` fails if it and
# vendor/gpui-pre.json disagree.
gpui = { package = "gpui-pre", version = ">=0.3.5, <=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "wayland", "x11"] }
htmlswap = { git = "https://github.com/themixednuts/htmlswap", rev = "7b6bd0f0c73cef241819c707615684fd2c066341" }
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
interprocess = { version = "2.4.4", features = ["tokio"] }
notify = "8.2.0"
mp4 = "0.14.0"
openh264 = "0.9.8"
rand = "0.10.3"
raw-window-handle = "0.6.2"
ron = "0.12.2"
rmcp = { version = "3.5.0", features = ["server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
xcap = { version = "0.9.8", features = ["wgc"] }
widestring = "1.2.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev.package.image]
opt-level = 2

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
