[workspace]
members = [
    "crates/gpui-mcp-capture",
    "crates/gpui-mcp-protocol",
    "crates/gpui-mcp",
    "crates/gpui-mcp-html",
    "crates/gpui-mcp-server",
    "crates/gpui-view-transitions",
    "examples/gpui-kit",
    "examples/runtime-showcase",
    "xtask",
]
exclude = ["vendor/gpui-fast"]
default-members = ["crates/gpui-mcp-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/themixednuts/gpui-mcp"
homepage = "https://github.com/themixednuts/gpui-mcp"

[workspace.dependencies]
anyhow = "1.0.100"
async-channel = "2.5.0"
base64 = "0.23.1"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
cow-utils = "0.1.3"
directories = "6.0.0"
# GPUI Fast (longbridge/gpui-fast), the one GPUI this workspace builds on, under
# GPUI's own crate names. The version has a patch series in
# vendor/patches/gpui-fast/; `cargo xtask vendor` fails if it and
# vendor/gpui-fast.json differ.
gpui = { package = "gpui-fast", version = "=0.1.6" }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.6", features = ["font-kit", "wayland", "x11"] }
# GPUI Kit's base layer, for its motion runtime, from GPUI Kit's GitHub main
# (its gpui-fast support is not in a release yet), on GPUI Fast.
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "ed27c6293b585acc40c10be7138534243bee5841", default-features = false, features = [
    "gpui-fast",
] }
# GPUI Kit itself, for the example the server's end-to-end tests drive.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "ed27c6293b585acc40c10be7138534243bee5841", features = ["gpui-fast"] }
htmlswap = { git = "https://github.com/themixednuts/htmlswap", rev = "80d36dff051050165ad8fdabc89abd288c9a72fc" }
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
insta = "1.49.0"
interprocess = { version = "2.4.2", features = ["tokio"] }
notify = "8.2.0"
mp4 = "0.14.0"
openh264 = "0.9.7"
rand = "0.10.3"
raw-window-handle = "0.6.2"
ron = "0.12.2"
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
rustc-hash = "2.1.3"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3.23.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
xcap = { version = "0.9.8", features = ["wgc"] }
widestring = "1.2.1"

# oxc's lint tables (oxc-project/oxc Cargo.toml), on top of this workspace's
# own stricter rules.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
self_named_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"
exit = "warn"
format_push_string = "warn"
fn_to_numeric_cast_any = "warn"
unnecessary_self_imports = "warn"
try_err = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"
infinite_loop = "warn"
map_with_unused_argument_over_ranges = "warn"
unused_result_ok = "warn"
pathbuf_init_then_push = "warn"
pub_underscore_fields = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
# pedantic lints oxc allows
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
similar_names = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev.package.image]
opt-level = 2

# Snapshot comparison and its diff, optimized as insta recommends (and oxc does).
[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[patch.crates-io]
gpui-fast = { path = "vendor/gpui-fast" }
