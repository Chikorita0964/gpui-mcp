[package]
name = "xtask"
description = "Maintenance tasks for gpui-mcp, run with `cargo xtask`"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
flate2 = "1.1.9"
serde_json.workspace = true
sha2 = "0.11"
tar = "0.4"
tempfile.workspace = true
toml = "0.9"
# The platform verifier trusts the system's certificates, including a
# corporate or proxy CA, and ureq reads HTTPS_PROXY from the environment.
ureq = { version = "3.4", features = ["platform-verifier"] }

[lints]
workspace = true
