name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

# A newer push to a pull request cancels its superseded run. Pushes to main and
# scheduled runs each get their own group so main's results are never lost.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A CI build is built once: incremental state only costs time and cache space (Zed's CI).
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Windows builds on a ReFS Dev Drive, much faster than the system drive, as oxc's and uv's CI do.
      - name: Set up a Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: bash .github/install-linux-deps.sh openbox xvfb x11-utils

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt && rustup default 1.99.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ". -> ${{ env.CARGO_TARGET_DIR || 'target' }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-nextest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install visual parity dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --features gpui-mcp/test-support,gpui-mcp-html/dev-watch,gpui-mcp-html/visual-parity --locked

      - name: Build integration test fixture
        run: cargo build -p gpui-mcp-kit-demo --locked

      # nextest as Zed's CI runs tests; on Linux each windowed test gets a display of its own
      # (.config/nextest.toml). No crate has doc tests.
      - name: Test workspace
        run: cargo nextest run --workspace --features gpui-mcp/test-support,gpui-mcp-html/dev-watch,gpui-mcp-html/visual-parity --locked

      - name: Test Chromium/GPUI visual parity
        if: runner.os != 'Linux'
        run: npm run test:visual

      - name: Test Chromium/GPUI visual parity under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a bash visual-tests/run-xvfb.sh
        env:
          WAYLAND_DISPLAY: ""

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features gpui-mcp/test-support,gpui-mcp-html/dev-watch,gpui-mcp-html/visual-parity --locked -- -D warnings

      # Builds and tests must not change the checkout: generated files are committed (oxc's CI).
      - name: Check that the checkout is unchanged
        run: git diff --exit-code

      - name: Upload visual parity failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-parity-${{ matrix.os }}
          path: visual-tests/artifacts
          if-no-files-found: ignore

  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  vendor:
    name: Reproduce vendored GPUI crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo xtask vendor --crate gpui-fast --check

  patch-series:
    # The main matrix builds the bridge against the vendored releases, every
    # patch applied. This job applies each release's series without one
    # optional patch to its crates.io archive and builds and tests the bridge
    # against the result, so an optional patch that the others come to depend
    # on fails here rather than downstream.
    # The bridge feature for each crate has the crate's name.
    name: ${{ matrix.crate }} ${{ matrix.version }}${{ matrix.without && format(' without {0}', matrix.without) || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The optional patches must stay independent of the automation patch.
          - crate: gpui-fast
            version: 0.1.6
            without: grid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux native dependencies
        run: bash .github/install-linux-deps.sh

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy && rustup default 1.99.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.crate }}-${{ matrix.version }}-${{ matrix.without }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Apply the patch series
        env:
          CRATE: ${{ matrix.crate }}
          VERSION: ${{ matrix.version }}
          WITHOUT: ${{ matrix.without }}
        run: >-
          cargo xtask vendor --crate "$CRATE" --version "$VERSION"
          --output "$RUNNER_TEMP/$CRATE"
          ${WITHOUT:+--without "$WITHOUT"}

      # The committed lockfile names the vendored release, so these steps
      # resolve the patched release instead of using --locked.
      - name: Test bridge
        env:
          CRATE: ${{ matrix.crate }}
        run: >-
          cargo test -p gpui-mcp --features test-support
          --config "patch.crates-io.$CRATE.path='$RUNNER_TEMP/$CRATE'"

      - name: Check that the bridge resolved the patched release
        env:
          CRATE: ${{ matrix.crate }}
          VERSION: ${{ matrix.version }}
        run: >-
          cargo tree -p gpui-mcp
          --config "patch.crates-io.$CRATE.path='$RUNNER_TEMP/$CRATE'"
          --depth 1 --prefix none | grep -Fx "$CRATE v$VERSION ($RUNNER_TEMP/$CRATE)"

      - name: Clippy
        env:
          CRATE: ${{ matrix.crate }}
        run: >-
          cargo clippy -p gpui-mcp --all-targets --features test-support
          --config "patch.crates-io.$CRATE.path='$RUNNER_TEMP/$CRATE'" -- -D warnings

  external-consumer:
    name: Public Git installation
    runs-on: ubuntu-24.04
    env:
      # Pull request runs check out a temporary merge commit that cannot be
      # fetched by revision, so install from the pull request head instead.
      REV: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux native dependencies
        run: bash .github/install-linux-deps.sh

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install gpui-mcp from this Git commit
        env:
          INSTALL_ROOT: ${{ runner.temp }}/gpui-mcp-install
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          cargo install --git "$REPOSITORY_URL" --rev "$REV" --locked
          --root "$INSTALL_ROOT" gpui-mcp-server

      - name: Verify the installed MCP executable
        env:
          INSTALL_ROOT: ${{ runner.temp }}/gpui-mcp-install
        run: '"$INSTALL_ROOT/bin/gpui-mcp" --version'

      - name: Check external GPUI Kit consumer
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          cargo xtask check-consumer --backend gpui-kit
          --repository "$REPOSITORY_URL" --rev "$REV"
          --target-dir "$GITHUB_WORKSPACE/target"
