name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

# A newer push to a pull request cancels its superseded run. Pushes to main and
# scheduled runs each get their own group so main's results are never lost.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang libclang-dev pkg-config cmake \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev libegl-dev libgbm-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxcb-composite0-dev libpipewire-0.3-dev libdbus-1-dev libegl1-mesa-dev \
            mesa-vulkan-drivers openbox xvfb

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt && rustup default 1.96.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install visual parity dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --features gpui-mcp/test-support,gpui-mcp-html/dev-watch,gpui-mcp-html/visual-parity --locked

      - name: Check screenshot-free integration
        run: cargo check -p gpui-mcp --no-default-features --features zed --locked

      - name: Build integration test fixture
        run: cargo build -p gpui-mcp-demo --locked

      - name: Test workspace
        run: cargo test --workspace --features gpui-mcp/test-support,gpui-mcp-html/dev-watch,gpui-mcp-html/visual-parity --locked

      - name: Test Chromium/GPUI visual parity
        if: runner.os != 'Linux'
        run: npm run test:visual

      - name: Test Chromium/GPUI visual parity under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a bash visual-tests/run-xvfb.sh
        env:
          WAYLAND_DISPLAY: ""

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features gpui-mcp/test-support,gpui-mcp-html/dev-watch,gpui-mcp-html/visual-parity --locked -- -D warnings

      - name: Check gpui-pre integration
        run: cargo check -p gpui-mcp --no-default-features --features gpui-pre --locked

      - name: Test bridge with gpui-pre
        run: cargo test -p gpui-mcp --no-default-features --features gpui-pre,test-support --locked

      - name: Check GPUI Kit example formatting
        run: cargo fmt --manifest-path examples/gpui-kit/Cargo.toml -- --check

      - name: Check GPUI Kit integration
        run: cargo check --manifest-path examples/gpui-kit/Cargo.toml --all-targets --locked

      - name: Test GPUI Kit controls and input
        run: cargo test --manifest-path examples/gpui-kit/Cargo.toml --locked

      - name: Clippy GPUI Kit bridge
        run: cargo clippy -p gpui-mcp --all-targets --no-default-features --features gpui-pre,test-support --locked -- -D warnings

      - name: Upload visual parity failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-parity-${{ matrix.os }}
          path: visual-tests/artifacts
          if-no-files-found: ignore

  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  vendor:
    name: Reproduce gpui-pre snapshot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 script/vendor-gpui-pre.py --check

  gpui-pre-range:
    # The main matrix builds the bridge against the vendored release. This job
    # applies each other supported release's patch series to its crates.io
    # archive and builds and tests the bridge against the result, so a patch
    # that stops applying or compiling fails here rather than downstream.
    name: gpui-pre ${{ matrix.version }}${{ matrix.without && format(' without {0}', matrix.without) || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 0.3.5
          - version: 0.3.6
          # The optional patches must stay independent of the automation patch.
          - version: 0.3.7
            without: font-fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang libclang-dev pkg-config cmake \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev libegl-dev libgbm-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxcb-composite0-dev libpipewire-0.3-dev libdbus-1-dev libegl1-mesa-dev \
            mesa-vulkan-drivers

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy && rustup default 1.96.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: gpui-pre-${{ matrix.version }}-${{ matrix.without }}

      - name: Apply the patch series
        env:
          VERSION: ${{ matrix.version }}
          WITHOUT: ${{ matrix.without }}
        run: >-
          python3 script/vendor-gpui-pre.py --version "$VERSION"
          --output "$RUNNER_TEMP/gpui-pre"
          ${WITHOUT:+--without "$WITHOUT"}

      # The committed lockfile names the vendored release, so these steps
      # resolve the patched release instead of using --locked.
      - name: Test bridge
        run: >-
          cargo test -p gpui-mcp --no-default-features --features gpui-pre,test-support
          --config "patch.crates-io.gpui-pre.path='$RUNNER_TEMP/gpui-pre'"

      - name: Check that the bridge resolved the patched release
        env:
          VERSION: ${{ matrix.version }}
        run: >-
          cargo tree -p gpui-mcp --no-default-features --features gpui-pre
          --config "patch.crates-io.gpui-pre.path='$RUNNER_TEMP/gpui-pre'"
          --depth 1 --prefix none | grep -Fx "gpui-pre v$VERSION ($RUNNER_TEMP/gpui-pre)"

      - name: Clippy
        run: >-
          cargo clippy -p gpui-mcp --all-targets --no-default-features --features gpui-pre,test-support
          --config "patch.crates-io.gpui-pre.path='$RUNNER_TEMP/gpui-pre'" -- -D warnings

  external-consumer:
    name: Public Git installation
    runs-on: ubuntu-24.04
    env:
      # Pull request runs check out a temporary merge commit that cannot be
      # fetched by revision, so install from the pull request head instead.
      REV: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang libclang-dev pkg-config cmake \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev libegl-dev libgbm-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxcb-composite0-dev libpipewire-0.3-dev libdbus-1-dev libegl1-mesa-dev \
            mesa-vulkan-drivers

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install gpui-mcp from this Git commit
        env:
          INSTALL_ROOT: ${{ runner.temp }}/gpui-mcp-install
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          cargo install --git "$REPOSITORY_URL" --rev "$REV" --locked
          --root "$INSTALL_ROOT" gpui-mcp-server

      - name: Verify the installed MCP executable
        env:
          INSTALL_ROOT: ${{ runner.temp }}/gpui-mcp-install
        run: '"$INSTALL_ROOT/bin/gpui-mcp" --version'

      - name: Check external GPUI Kit consumer
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          python3 script/check-gpui-kit-consumer.py
          --repository "$REPOSITORY_URL" --rev "$REV"
          --target-dir "$GITHUB_WORKSPACE/target"
