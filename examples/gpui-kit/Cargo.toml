[package]
name = "gpui-mcp-kit-demo"
description = "GPUI Kit controls observed and driven by the gpui-mcp bridge, on GPUI Fast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# No doc tests in this crate: cargo test --doc would build its docs for nothing.
doctest = false

[dependencies]
gpui-kit.workspace = true
gpui-mcp = { path = "../../crates/gpui-mcp" }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
gpui-mcp = { path = "../../crates/gpui-mcp", features = ["test-support"] }

[lints]
workspace = true
