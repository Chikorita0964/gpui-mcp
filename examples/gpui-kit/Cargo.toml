[package]
name = "gpui-mcp-kit-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

# Separate workspace: this demo pins GPUI Kit's own GPUI snapshot, and its
# lockfile resolves independently of the demos' workspace.
[workspace]
resolver = "3"

[dependencies]
gpui-kit = "=0.7.0"
gpui-mcp = { path = "../../crates/gpui-mcp" }

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
gpui-mcp = { path = "../../crates/gpui-mcp", features = ["test-support"] }

[patch.crates-io]
gpui-pre = { path = "../../vendor/gpui-pre" }
