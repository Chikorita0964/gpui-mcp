[package]
name = "gpui-mcp-kit-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

# Separate workspace: Cargo features are additive, and the Zed demos must not
# enable their backend on the bridge used by this GPUI Kit application.
[workspace]
resolver = "3"

# GPUI Kit draws on gpui-pre by default; `gpui-fast` selects GPUI Fast for Kit
# and the bridge alike (`--no-default-features --features gpui-fast`).
[features]
default = ["gpui-pre"]
gpui-pre = ["gpui-mcp/gpui-pre"]
gpui-fast = ["gpui-kit/gpui-fast", "gpui-mcp/gpui-fast"]

# GPUI Kit from its GitHub main: its `gpui-fast` feature is not in a release yet.
[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "ed27c6293b585acc40c10be7138534243bee5841" }
gpui-mcp = { path = "../../crates/gpui-mcp", default-features = false }

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "ed27c6293b585acc40c10be7138534243bee5841", features = ["test-support"] }
gpui-mcp = { path = "../../crates/gpui-mcp", default-features = false, features = ["test-support"] }

[patch.crates-io]
gpui-pre = { path = "../../vendor/gpui-pre" }
gpui-fast = { git = "https://github.com/Chikorita0964/gpui-fast-mcp", rev = "4f14ed3b13fcafb8ef2e38e74426a12cfbcef79c" }
